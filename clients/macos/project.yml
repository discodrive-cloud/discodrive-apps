name: DiscoDrive
options:
  bundleIdPrefix: org.discodrive
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: TQD2R45V4P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  DiscoKit:
    path: ../DiscoKit
targets:
  DiscoDrive:
    type: application
    platform: macOS
    sources: [Sources, ../shared, Resources/Assets.xcassets, Resources/AppIcon.icns, Resources/DiscoDrive.icon]
    dependencies:
      - package: DiscoKit
      - target: FileProviderExt
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.discodrive.app
        INFOPLIST_FILE: Resources/Info.plist
        # App icon: the Icon Composer document (DiscoDrive.icon) for macOS 26's layered look,
        # and a prebuilt AppIcon.icns (CFBundleIconFile) for everything older.
        ASSETCATALOG_COMPILER_APPICON_NAME: DiscoDrive
        # Sandboxed (see the entitlements) and hardened: both are conditions for hosting the
        # File Provider extension, for notarization and for the App Store.
        CODE_SIGN_ENTITLEMENTS: Resources/DiscoDrive.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # The DiscoDrive folder in Finder. Shares the index (App Group) and the token (keychain
  # group) with the app; see FileProviderExt/Info.plist for the two NSExtension keys
  # without which macOS refuses to launch it.
  FileProviderExt:
    type: app-extension
    platform: macOS
    sources: [FileProviderExt, ../shared/ServerVaultIO.swift]
    dependencies:
      - package: DiscoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.discodrive.app.fileprovider
        INFOPLIST_FILE: FileProviderExt/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FileProviderExt/FileProviderExt.entitlements
        ENABLE_HARDENED_RUNTIME: YES
